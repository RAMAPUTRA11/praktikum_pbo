# Nama database harus sama dengan yang lu bikin di phpMyAdmin tadi
spring.datasource.url=jdbc:mysql://localhost:3306/manajemen_pajak_db
spring.datasource.username=root
spring.datasource.password=

# Hibernate setting (Biar Spring Boot otomatis sinkron tabel)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Tambahin ini di application.properties lu yang paling bawah
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/