<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akses TaxFlow | Pilih Mode Masuk</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #f8fafc;
            --sidebar-navy: #0f172a;
            --primary-emerald: #10b981;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
            --border-color: #e2e8f0;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
        }

        body { 
            background: radial-gradient(circle at 50% 50%, #f1f5f9 0%, #e2e8f0 100%);
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            padding: 20px;
        }

        .access-card { 
            background: var(--white); 
            padding: 48px 40px; 
            border-radius: 24px; 
            border: 1px solid var(--border-color); 
            text-align: center; 
            width: 100%;
            max-width: 400px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1);
            position: relative;
        }

        .logo-brand {
            font-size: 26px;
            font-weight: 800;
            color: var(--sidebar-navy);
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .logo-brand span { color: var(--primary-emerald); }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 35px;
        }

        .btn { 
            width: 100%; 
            padding: 16px; 
            margin: 10px 0; 
            border-radius: 12px; 
            border: none; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-public { 
            background: var(--primary-emerald); 
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-user { 
            background: var(--sidebar-navy); 
            color: white; 
        }

        .btn:hover { 
            transform: translateY(-2px); 
            opacity: 0.95;
        }

        .btn-public:hover {
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--border-color);
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider span {
            padding: 0 15px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-link {
            margin-top: 25px;
            display: inline-block;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
        }

        .back-link:hover { color: var(--sidebar-navy); }

        .feature-tag {
            font-size: 11px;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="access-card">
        <div class="feature-tag">Sistem Manajemen Fiskal v3.0</div>
        <h2 class="logo-brand">Tax<span>Flow.</span></h2>
        <p class="subtitle">Pilih cara Anda ingin melanjutkan</p>
        
        <button class="btn btn-public" onclick="aksesPublic()">
            <span>⚡</span> Coba Guest Mode
        </button>
        
        <div class="divider">
            <span>Atau</span>
        </div>
        
        <button class="btn btn-user" onclick="window.location.href='login.html'">
            <span>👤</span> Masuk ke Akun
        </button>

        <a href="index.html" class="back-link">← Kembali ke Beranda</a>
    </div>

    <script>
        function aksesPublic() {
            // Tampilkan loading sebentar biar kerasa 'proses'
            Swal.fire({
                title: 'Mempersiapkan Sandbox',
                text: 'Membuka akses kalkulator publik...',
                timer: 1000,
                showConfirmButton: false,
                didOpen: () => Swal.showLoading()
            }).then(() => {
                const publicData = {
                    id: "MODE_PUBLIC",
                    fullName: "Guest User",
                    onboarded: true
                };
                localStorage.setItem("userPajak", JSON.stringify(publicData));
                localStorage.removeItem("guestHistory"); 
                
                window.location.href = "dashboard.html";
            });
        }
    </script>
</body>
</html>
